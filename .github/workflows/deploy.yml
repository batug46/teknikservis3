name: Deploy to Production Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
        EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
        EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
        EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

    - name: Deploy to Server
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Proje dizinine git
          cd /var/www/teknik-servis-v2
          
          # Git'ten son değişiklikleri çek
          git pull origin main
          
          # Node modüllerini güncelle
          npm ci --production
          
          # Prisma client'ı yeniden oluştur
          npx prisma generate
          
          # Database migration'ları çalıştır
          npx prisma db push
          
          # Next.js build
          npm run build
          
          # PM2 ile uygulamayı yeniden başlat
          pm2 restart tekniverse-app || pm2 start npm --name "tekniverse-app" -- start
          
          # PM2 durumunu kontrol et
          pm2 status
          
          echo "🚀 Deployment completed successfully!"